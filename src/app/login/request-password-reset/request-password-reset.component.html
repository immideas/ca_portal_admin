<main>
  <div class="container">
    <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6 col-md-8 d-flex flex-column align-items-center justify-content-center">
            <div class="card mb-3" style="width: 100%; padding-bottom: 30px;">
              <div class="card-body">
                <div class="pt-4 pb-2">
                  <h5 class="card-title text-center pb-0 fs-4">Forgot Password</h5>
                  <p class="text-center text-muted small">
                    Enter your email. Your administrator will be notified to reset your password.
                  </p>
                </div>

                <div *ngIf="!submitted">
                  <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3">
                    <div class="col-12">
                      <label for="email" class="form-label">Email</label>
                      <input
                        type="email"
                        formControlName="email"
                        class="form-control"
                        id="email"
                        placeholder="Enter your registered email"
                      />
                    </div>
                    <div class="col-12">
                      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
                        {{ loading ? 'Sending...' : 'Send Request' }}
                      </button>
                    </div>
                    <div class="col-12 text-center">
                      <a routerLink="/login" class="small">Back to Login</a>
                    </div>
                  </form>
                </div>

                <div *ngIf="submitted" class="text-center">
                  <p class="text-success">
                    If this email is registered, your administrator has been notified.
                  </p>
                  <a routerLink="/login" class="btn btn-primary mt-2">Back to Login</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>
