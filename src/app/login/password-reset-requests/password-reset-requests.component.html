<main id="main" class="main">
  <section class="section">
    <div class="container-fluid py-4">

      <div class="page-header-row">
        <div class="page-header">
          <h1>Password Reset Requests</h1>
          <p>Approve pending forgot-password requests</p>
        </div>
      </div>

      <div class="data-table-wrapper">
        <div class="data-table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Requested At</th>
                <th class="col-action">Action</th>
              </tr>
            </thead>
            <tbody>

              <ng-container *ngIf="loading">
                <tr *ngFor="let r of [1,2,3]" class="sk-list-row">
                  <td><div class="sk sk-cell sk-cell--lg"></div></td>
                  <td><div class="sk sk-cell sk-cell--lg"></div></td>
                  <td><div class="sk sk-cell sk-cell--sm"></div></td>
                  <td><div class="sk sk-cell sk-cell--md"></div></td>
                  <td class="col-action"><div class="sk sk-cell sk-cell--xs" style="margin:0 auto"></div></td>
                </tr>
              </ng-container>

              <tr *ngIf="!loading && requests.length === 0">
                <td colspan="5" class="text-center py-5">
                  <div class="text-muted">No pending requests.</div>
                </td>
              </tr>

              <tr *ngFor="let r of requests">
                <td>{{ r.name }}</td>
                <td>{{ r.email }}</td>
                <td>{{ r.roleCode }}</td>
                <td>{{ r.requestedAt | date:'medium' }}</td>
                <td class="col-action">
                  <button class="btn-primary" (click)="confirmApprove(r)">
                    Approve & Reset
                  </button>
                </td>
              </tr>

            </tbody>
          </table>
        </div>
      </div>
    </div>
  </section>
</main>
