<h1 mat-dialog-title>{{ data.title || 'Confirm' }}</h1>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions class="dialog-actions">
  <button mat-button class="no-button" (click)="onNoClick()">{{ data.noLabel || 'No' }}</button>
  <button mat-button class="yes-button" [mat-dialog-close]="true">{{ data.yesLabel || 'Yes' }}</button>
</div>
