<main id="main" class="main-main">
  <div class="filter-layout">
    <div class="table-section">
      <div class="workflow-container">
        <div class="pagetitle">
          <h1>Manage Email Templates</h1>
          <p class="subtitle">View and manage all event-based email templates</p>
        </div>

        <div class="toolbar-list-desgin">
          <div class="toolbar-list-desgin-left">
            <div class="search-box">
              <i class="bi bi-search"></i>
              <input type="text" placeholder="Search title, event or subject..." [(ngModel)]="searchQuery"
                (input)="onSearchChange()" />
            </div>

            <button class="btn-reset" (click)="resetFilter()" title="Reset Filters">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>

          <div class="toolbar-list-desgin-right">
            <button *ngIf="canAdd" class="btn-add" (click)="add()">
              <i class="bi bi-plus-lg"></i> New Template
            </button>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table id="emailTemplatesTable" class="modern-table">
          <thead>
            <tr>
              <th>
                <div class="th-inner">Title</div>
              </th>
              <th>
                <div class="th-inner">Event</div>
              </th>
              <th>
                <div class="th-inner">Subject</div>
              </th>
              <th class="action-col-header">
                <div>Actions</div>
              </th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let t of templates; let i = index" [class.active-row]="activePopup?.index === i"
              (click)="view(t.id)" class="clickable-row">
              <td class="td-primary" data-label="Title">{{ t.title }}</td>
              <td class="td-secondary" data-label="Event">{{ t.event_details?.name || 'N/A' }}</td>
              <td class="td-secondary" data-label="Subject">{{ t.subject }}</td>

              <td class="action-col-data" data-label="Actions" (click)="$event.stopPropagation()">
                <app-three-dots-button
                  [active]="activePopup?.index === i"
                  (menuClick)="openActionMenu(i, t, $any($event))">
                </app-three-dots-button>
              </td>
            </tr>

            <tr *ngIf="templates.length === 0">
              <td colspan="4" class="text-center py-5">
                <div class="text-muted">
                  <i class="bi bi-envelope-paper" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
                  No email templates found. Try adjusting your search.
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination-footer" *ngIf="totalItems > 0">
        <div class="pagination-info">
          Showing {{ templates.length }} of {{ totalItems }} entries
        </div>
        <nav aria-label="Page navigation">
          <ul class="pagination">
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="onPageChange(1)" title="First"><i class="bi bi-chevron-bar-left"></i></a>
            </li>
            <li class="page-item" [class.disabled]="currentPage === 1">
              <a class="page-link" (click)="onPageChange(currentPage - 1)" title="Previous"><i
                  class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item mx-1" *ngFor="let p of [].constructor(Math.ceil(totalItems/pageSize)); let i = index"
              [class.active]="currentPage === (i + 1)">
              <a class="page-link" (click)="onPageChange(i + 1)">{{ i + 1 }}</a>
            </li>
            <li class="page-item" [class.disabled]="currentPage * pageSize >= totalItems">
              <a class="page-link" (click)="onPageChange(currentPage + 1)" title="Next"><i
                  class="bi bi-chevron-right"></i></a>
            </li>
            <li class="page-item" [class.disabled]="currentPage * pageSize >= totalItems">
              <a class="page-link" (click)="onPageChange(Math.ceil(totalItems/pageSize))" title="Last"><i
                  class="bi bi-chevron-bar-right"></i></a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <app-popup-menu
    *ngIf="activePopup"
    [title]="activePopup.config.title"
    [items]="activePopup.config.items"
    [width]="activePopup.config.width ?? 180"
    [position]="activePopup.config.position"
    (closeClick)="closePopup()"
    (itemClick)="onMenuItemClick($any($event))">
  </app-popup-menu>

</main>
