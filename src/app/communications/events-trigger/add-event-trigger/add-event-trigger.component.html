<main id="main" class="complaint-wrapper">
  <header class="top-header">
    <div class="header-left">
      <button type="button" class="back-btn" (click)="cancel()" aria-label="Go back">
        <img src="assets/img/back-icon.svg" alt="back">
      </button>
      <div class="divider"></div>
      <div class="title-box">
        <div class="title-icon">
          <img src="assets/img/Plus.svg" alt="add">
        </div>
        <div class="title-text">
          <h4>{{ pageTitle }}</h4>
          <p>{{ pageSubtitle }}</p>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <ng-container *ngIf="isViewMode; else editOrSaveMode">
        <button *ngIf="canEdit" type="button" class="btn-save btn-active" (click)="enableEditMode()">
          <i class="bi bi-pencil-square"></i>
          <span>Edit</span>
        </button>
      </ng-container>
      <ng-template #editOrSaveMode>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>

        <span class="uploading-indicator" *ngIf="showBtnLoader">
          <span class="status-spinner-small"></span> Saving...
        </span>

        <button type="submit" form="eventForm" class="btn-save"
          [ngClass]="{ 'btn-active': eventForm.valid && !showBtnLoader }"
          [disabled]="eventForm.invalid || showBtnLoader">
          <img class="save-icon" src="assets/img/Group-Save.svg" alt="save">
          <span>{{ isEditMode ? 'Update' : 'Save' }}</span>
        </button>
      </ng-template>
    </div>
  </header>

  <article class="card complaint-card">
    <div class="section-title">
      <div class="item-icon">
        <img src="assets/img/Information.svg" alt="info">
      </div>
      <div class="header-content">
        <span class="header-text">Event Details</span>
      </div>
      <div class="required-group">
        <span class="badge-required">
          Required
          <img src="assets/img/star.svg" class="required-icon" alt="required-star">
        </span>
      </div>
    </div>

    <div *ngIf="errorValue" class="alert alert-danger mx-4 mt-3">
      {{ errorValue }}
    </div>

    <div class="loading-state" *ngIf="showLoader">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <form *ngIf="!showLoader" [formGroup]="eventForm" id="eventForm" (ngSubmit)="onSubmit()" class="form-padding-wrap" novalidate>

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label for="name">
            Name <img src="assets/img/star.svg" class="required-icon" alt="required">
          </label>
          <div class="field-wrap">
            <input id="name" type="text" formControlName="name" class="form-controler" placeholder="Enter event name" />
          </div>
          <div class="text-danger mt-1 field-error-text"
            *ngIf="f['name'].touched && f['name'].invalid">
            Name is required.
          </div>
        </div>

        <div class="col-md-6 form-group">
          <label for="status">
            Status <img src="assets/img/star.svg" class="required-icon" alt="required">
          </label>
          <div class="field-wrap">
            <select id="status" formControlName="status" class="form-controler">
              <option [value]="1">Active</option>
              <option [value]="0">Inactive</option>
              <option [value]="2">Draft</option>
            </select>
          </div>
        </div>
      </div>
<div class="row mb-3" *ngIf="isEditMode && eventDetails?.short_code">
  <div class="col-md-6 form-group">
    <label for="shortCode">Short Code</label>
    <div class="field-wrap">
      <input id="shortCode" type="text" class="form-controler" [value]="eventDetails?.short_code" readonly />
    </div>
    <div class="text-muted mt-1" style="font-size: 11px;">
      Auto-generated by the system from the event name — used in code to trigger this event.
    </div>
  </div>
</div>
      <div class="row mb-3">
        <div class="col-md-12 form-group">
          <label for="description">Description</label>
          <div class="field-wrap">
            <textarea id="description" rows="4" formControlName="description" class="form-controler"
              placeholder="Enter event description"></textarea>
          </div>
        </div>
      </div>

    </form>
  </article>
</main>
