<main id="main" class="complaint-wrapper">
  <ngx-ui-loader></ngx-ui-loader>

  <header class="top-header">
    <div class="header-left">
      <button type="button" class="back-btn" (click)="cancel()" aria-label="Go back">
        <img src="assets/img/back-icon.svg" alt="back">
      </button>

      <div class="divider"></div>

      <div class="title-box">
        <div class="title-icon">
          <img src="assets/img/Plus.svg" alt="add">
        </div>
        <div class="title-text">
          <h4>
            {{ isViewMode ? 'View WhatsApp Template' : isEditMode ? 'Edit WhatsApp Template' : 'Add WhatsApp Template' }}
          </h4>
          <p>WhatsApp template details and configuration</p>
        </div>
      </div>
    </div>

    <div class="header-actions">
      <ng-container *ngIf="isViewMode; else editOrSaveMode">
        <button *ngIf="canEdit" type="button" class="btn-save btn-active" (click)="enableEdit()">
          <i class="bi bi-pencil-square"></i>
          <span>Edit</span>
        </button>
      </ng-container>

      <ng-template #editOrSaveMode>
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>

        <button type="submit" form="templateForm" class="btn-save" [ngClass]="{ 'btn-active': templateForm.valid }"
          [disabled]="templateForm.invalid">
          <img class="save-icon" src="assets/img/Group-Save.svg" alt="save">
          <span>{{ isEditMode ? 'Update' : 'Save' }}</span>
        </button>
      </ng-template>
    </div>
  </header>

  <article class="card complaint-card">
    <div class="section-title">
      <div class="item-icon">
        <img src="assets/img/Information.svg" alt="info">
      </div>
      <div class="header-content">
        <span class="header-text">WhatsApp Details Form</span>
      </div>
      <div class="required-group">
        <span class="badge-required">
          Required
          <img src="assets/img/star.svg" class="required-icon" alt="required-star">
        </span>
      </div>
    </div>

    <form [formGroup]="templateForm" id="templateForm" (ngSubmit)="save()" class="form-padding-wrap">

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label for="title">
            Title <img src="assets/img/star.svg" class="required-icon" alt="required">
          </label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input id="title" type="text" formControlName="title"
              class="form-controler" placeholder="Enter template title" [readonly]="isViewMode" />
          </div>
        </div>

        <div class="col-md-6 form-group">
          <label for="event_id">Event</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <select id="event_id" formControlName="event_id" class="form-controler">
              <option value="">Select event</option>
              <option *ngFor="let ev of events" [value]="ev.id">{{ ev.name }}</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label for="type">Type</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <select id="type" formControlName="type" class="form-controler">
              <option value="">Select type</option>
              <option *ngFor="let t of typeOptions" [value]="t">{{ t | titlecase }}</option>
            </select>
          </div>
        </div>

        <div class="col-md-6 form-group">
          <label for="dltTemplateId">DLT Template ID</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input id="dltTemplateId" type="text" formControlName="dltTemplateId"
              class="form-controler" placeholder="Enter DLT template ID" [readonly]="isViewMode" />
          </div>
        </div>
      </div>

      <div class="row mb-3" *ngIf="isEditMode || isViewMode">
        <div class="col-md-6 form-group">
          <label for="status">Status</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <select id="status" formControlName="status" class="form-controler">
              <option [value]="1">Active</option>
              <option [value]="0">Inactive</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-12 form-group">
          <label for="body">
            Body <img src="assets/img/star.svg" class="required-icon" alt="required">
          </label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <textarea id="body" class="form-controler" rows="8"
              formControlName="body" placeholder="Enter WhatsApp message body"></textarea>
          </div>
          <div class="text-muted mt-1" style="font-size: 11px;">
            Use placeholders like {{ '{{name}}' }}, {{ '{{ticket_id}}' }}
          </div>
        </div>
      </div>

      <div class="row mb-3" *ngIf="templateForm.value.body">
        <div class="col-md-12 form-group">
          <label>Preview</label>
          <div class="border p-3 bg-light rounded" style="min-height: 80px; border-color: #D1D5DB !important; white-space: pre-wrap;">
            {{ templateForm.value.body }}
          </div>
        </div>
      </div>

    </form>
  </article>
</main>
