      </button>
      <ul class="dropdown-menu dropdown-menu-end settings-dropdown">
        <li>
          <a class="dropdown-item" routerLink="/change-password">
            <i class="bi bi-key"></i>
            Change Password
          </a>
        </li>
      </ul>
    </div>

    <div class="dropdown">
      <button class="profile-btn" type="button"
              data-bs-toggle="dropdown" aria-expanded="false">
        <span class="user-avatar">{{ userInitial }}</span>
        <i class="bi bi-chevron-down chevron-icon"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end profile-dropdown">
        <li class="profile-header">
          <span class="user-avatar user-avatar--lg">{{ userInitial }}</span>
          <div class="profile-info">
            <span class="profile-name">{{ userName }}</span>
            <span class="profile-role">{{ formattedRole }}</span>
          </div>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item sign-out" (click)="logout()" style="cursor:pointer;">
            <i class="bi bi-box-arrow-right"></i>
            Sign Out
          </a>
        </li>
      </ul>
    </div>

  </div>
</header>

<div class="right-sidebar" [class.open]="isRightSidebarOpen">
</div>
