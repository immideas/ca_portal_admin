<main id="main" class="complaint-wrapper">

  <!-- ================= HEADER ================= -->

  <header class="top-header">

    <div class="header-left">

      <button
        type="button"
        class="back-btn"
        (click)="goBack()"
        aria-label="Go back"
      >
        <img
          src="assets/img/back-icon.svg"
          alt="view"
        />
      </button>

      <div class="divider"></div>

      <div class="title-box">

        <div class="title-icon">
          <img
            src="assets/img/Plus.svg"
            alt="view"
          />
        </div>

        <div class="title-text">

          <h4>
            View Client
          </h4>

          <p>
            Client details
          </p>

        </div>

      </div>

    </div>

  </header>


  <!-- ================= TABS ================= -->

  <div class="client-tabs">

    <!-- TAB OPTIONS -->

    <div class="client-tab-options">

      <button
        type="button"
        [class.active]="activeTab === 'basic'"
        (click)="setTab('basic')"
      >
        Basic Details
      </button>

      <button
        type="button"
        [class.active]="activeTab === 'kyc'"
        (click)="setTab('kyc')"
      >
        KYC Details
      </button>

      <button
        type="button"
        [class.active]="activeTab === 'services'"
        (click)="setTab('services')"
      >
        Services
      </button>

    </div>


    <!-- COMMON EDIT BUTTON -->

    <button
      type="button"
      class="tab-edit-btn"
      (click)="
        activeTab === 'basic'
          ? editBasicDetails()
          : activeTab === 'kyc'
            ? editKyc()
            : editServices()
      "
    >

      <i class="bi bi-pencil-square"></i>

      <span>
        Edit
      </span>

    </button>

  </div>


  <!-- ================= TAB CONTENT ================= -->

  <div class="client-tab-content">


    <!-- =====================================================
         BASIC DETAILS
         ===================================================== -->

    <div *ngIf="activeTab === 'basic'">

      <!-- BASIC DETAILS COMPONENT -->

      <app-add-client
        [clientIdInput]="clientId"
        [isViewMode]="true"
        [embedded]="true">
      </app-add-client>

    </div>


    <!-- =====================================================
         KYC DETAILS
         ===================================================== -->

    <div *ngIf="activeTab === 'kyc'">

      <!-- KYC COMPONENT -->

      <app-client-kyc
        [clientIdInput]="clientId"
        [isViewMode]="true"
        [embedded]="true">
      </app-client-kyc>

    </div>


    <!-- =====================================================
         SERVICES
         ===================================================== -->

    <div *ngIf="activeTab === 'services'">

      <!-- SERVICES COMPONENT -->

      <app-add-client-services
        [clientIdInput]="clientId"
        [isViewMode]="true"
        [embedded]="true">
      </app-add-client-services>

    </div>

  </div>

</main>
