<main id="main" class="main">
  <section class="section">
    <div class="container-fluid py-4">
      <!-- ================= PAGE HEADER ================= -->

      <div class="page-header-row">
        <div class="page-header">
          <h1>Manage Documents</h1>

          <p>View and manage all documents</p>
        </div>

        <div class="page-header-actions">
          <button class="btn-primary" (click)="addDocument()">
            <i class="bi bi-plus-lg"></i>

            Add Document
          </button>
        </div>
      </div>

      <!-- ================= DATA TABLE ================= -->

      <div class="data-table-wrapper">
        <!-- ================= TOP TOOLBAR ================= -->

        <div class="page-top-toolbar">
          <div class="toolbar-left">
            <label class="entries-label">
              Show

              <span class="entries-select-wrap">
                <div class="entries-select-box">
                  <span class="entries-number">
                    {{ pageSize }}
                  </span>

                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path
                      d="M3 4.5L6 7.5L9 4.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </div>

                <select
                  class="entries-select-native"
                  [value]="pageSize"
                  (change)="onPageSizeChange($event)"
                >
                  <option *ngFor="let s of [10, 25, 50, 100]" [value]="s">
                    {{ s }}
                  </option>
                </select>
              </span>

              entries
            </label>
          </div>

          <!-- ================= SEARCH ================= -->

          <div class="toolbar-right">
            <div class="search-input-wrap">
              <span class="search-icon">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <circle
                    cx="6"
                    cy="6"
                    r="4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />

                  <path
                    d="M9.5 9.5L12 12"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />
                </svg>
              </span>

              <input
                class="search-input"
                type="text"
                placeholder="Search..."
                [(ngModel)]="search"
                (input)="onSearchChange()"
              />
            </div>
          </div>
        </div>

        <!-- ================= TABLE ================= -->

        <div class="data-table-scroll">
          <table id="documentTable" class="data-table">
            <thead>
              <tr>
                <!-- <th>Document Code</th> -->

                <th>Document Name</th>

                <th>Group Name</th>

                <!-- <th>Group Code</th> -->

                <th>Document Type</th>

                <!-- <th>Mandatory</th> -->

                <!-- <th>Allowed File Types</th> -->

                <th>Status</th>

                <th class="col-action">Actions</th>
              </tr>
            </thead>

            <tbody>
              <!-- ================= LOADING SKELETON ================= -->

              <ng-container *ngIf="loading">
                <tr *ngFor="let r of [1, 2, 3, 4, 5]" class="sk-list-row">
                  <td>
                    <div class="sk sk-cell sk-cell--sm"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--lg"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--lg"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--sm"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--sm"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--sm"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--lg"></div>
                  </td>

                  <td>
                    <div class="sk sk-cell sk-cell--sm"></div>
                  </td>

                  <td class="col-action">
                    <div
                      class="sk sk-cell sk-cell--xs"
                      style="margin: 0 auto"
                    ></div>
                  </td>
                </tr>
              </ng-container>

              <!-- ================= NO DATA ================= -->

              <tr *ngIf="!loading && filteredDocuments.length === 0">
                <td colspan="9" class="text-center py-5">
                  <div class="text-muted">No documents found.</div>
                </td>
              </tr>

              <!-- ================= DOCUMENTS ================= -->

              <ng-container *ngIf="!loading">
                <tr
                  *ngFor="let document of filteredDocuments; let i = index"
                  [ngClass]="{
                    'disabled-row': document.status === 0,
                  }"
                  (click)="viewDocument(document.id)"
                  style="cursor: pointer"
                >
                  <!-- Document Code -->

                  <!-- <td>
                    {{ document.documentCode }}
                  </td> -->

                  <!-- Document Name -->

                  <td>
                   {{ document.documentName }}
                  </td>

                  <!-- Group Name -->

                  <td>
                    {{ document.groupName }}
                  </td>

                  <!-- Group Code -->

                  <!-- <td>
                    {{ document.groupCode }}
                  </td> -->

                  <!-- Document Type -->

                  <td>
                    <span *ngIf="document.documentType">
                        {{ document.documentType.name }}
                    </span>

                    <span *ngIf="!document.documentType" class="text-muted">
                      —
                    </span>
                  </td>

                  <!-- Mandatory -->

                  <!-- <td>
                    <span *ngIf="document.isMandatory"> Yes </span>

                    <span *ngIf="!document.isMandatory" class="text-muted">
                      No
                    </span>
                  </td> -->

                  <!-- Allowed File Types -->
<!-- 
                  <td>
                    <span *ngIf="document.allowedFileTypes">
                      {{ document.allowedFileTypes }}
                    </span>

                    <span *ngIf="!document.allowedFileTypes" class="text-muted">
                      —
                    </span>
                  </td> -->

                  <!-- Status -->

                  <td (click)="$event.stopPropagation()">
                    <app-status-toggle
                      [checked]="document.status === 1"
                      (toggled)="onStatusToggle(document, $event)"
                    >
                    </app-status-toggle>
                  </td>

                  <!-- Actions -->

                  <td class="col-action" (click)="$event.stopPropagation()">
                    <app-three-dots-button
                      [active]="activeMenuId === document.id"
                      (menuClick)="openMenu(document, $event)"
                    >
                    </app-three-dots-button>
                  </td>
                </tr>
              </ng-container>
            </tbody>
          </table>
        </div>

        <!-- ================= PAGINATION ================= -->

        <app-pagination-footer
          *ngIf="totalItems > 0"
          [totalItems]="totalItems"
          [pageSize]="pageSize"
          [currentPage]="currentPage"
          itemLabel="documents"
          (pageChange)="onPageChange($event)"
        >
        </app-pagination-footer>
      </div>
    </div>
  </section>
</main>

<!-- ================= POPUP MENU ================= -->

<app-popup-menu
  *ngIf="menuPopupPosition"
  title="Actions"
  [items]="actionItems"
  [position]="menuPopupPosition"
  (itemClick)="onMenuItemClick($event)"
  (closeClick)="closeMenu()"
>
</app-popup-menu>
