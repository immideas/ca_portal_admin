<main id="main" class="main">
  <section class="section">
    <div class="container-fluid py-4">

      <div class="page-header-row">

        <div class="page-header">
          <h1>Manage Client Groups</h1>

          <p>
            View and manage all client groups
          </p>
        </div>

        <div class="page-header-actions">

          <button
            class="btn-primary"
            (click)="addClientGroup()"
          >
            <i class="bi bi-plus-lg"></i>
            Add Client Group
          </button>

        </div>

      </div>


      <!-- Data Table -->
      <div class="data-table-wrapper">


        <!-- Top Toolbar -->
        <div class="page-top-toolbar">

          <div class="toolbar-left">

            <label class="entries-label">

              Show

              <span class="entries-select-wrap">

                <div class="entries-select-box">

                  <span class="entries-number">
                    {{ pageSize }}
                  </span>

                  <svg
                    width="12"
                    height="12"
                    viewBox="0 0 12 12"
                    fill="none"
                  >
                    <path
                      d="M3 4.5L6 7.5L9 4.5"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>

                </div>

                <select
                  class="entries-select-native"
                  [value]="pageSize"
                  (change)="onPageSizeChange($event)"
                >

                  <option
                    *ngFor="let s of [10, 25, 50, 100]"
                    [value]="s"
                  >
                    {{ s }}
                  </option>

                </select>

              </span>

              entries

            </label>

          </div>


          <!-- Search -->
          <div class="toolbar-right">

            <div class="search-input-wrap">

              <span class="search-icon">

                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 14 14"
                  fill="none"
                >

                  <circle
                    cx="6"
                    cy="6"
                    r="4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                  />

                  <path
                    d="M9.5 9.5L12 12"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                  />

                </svg>

              </span>

              <input
                class="search-input"
                type="text"
                placeholder="Search..."
                [(ngModel)]="search"
                (input)="onSearchChange()"
              />

            </div>

          </div>

        </div>


        <!-- Table -->
        <div class="data-table-scroll">

          <table
            id="clientGroupTable"
            class="data-table"
          >

            <thead>

              <tr>

                <th>
                  Group Name
                </th>

                <th>
                  Group Code
                </th>

                <th>
                  Description
                </th>

                <th>
                  Status
                </th>

                <th class="col-action">
                  Actions
                </th>

              </tr>

            </thead>


            <tbody>


              <!-- Loading Skeleton -->
              <ng-container *ngIf="loading">

                <tr
                  *ngFor="let r of [1,2,3,4,5]"
                  class="sk-list-row"
                >

                  <td>
                    <div
                      class="sk sk-cell sk-cell--lg"
                    ></div>
                  </td>

                  <td>
                    <div
                      class="sk sk-cell sk-cell--sm"
                    ></div>
                  </td>

                  <td>
                    <div
                      class="sk sk-cell sk-cell--lg"
                    ></div>
                  </td>

                  <td>
                    <div
                      class="sk sk-cell sk-cell--sm"
                    ></div>
                  </td>

                  <td class="col-action">

                    <div
                      class="sk sk-cell sk-cell--xs"
                      style="margin:0 auto"
                    ></div>

                  </td>

                </tr>

              </ng-container>


              <!-- No Data -->
              <tr
                *ngIf="
                  !loading &&
                  filteredGroups.length === 0
                "
              >

                <td
                  colspan="5"
                  class="text-center py-5"
                >

                  <div class="text-muted">
                    No client groups found.
                  </div>

                </td>

              </tr>


              <!-- Client Groups -->
              <ng-container *ngIf="!loading">

                <tr
                  *ngFor="
                    let clientGroup of filteredGroups;
                    let i = index
                  "

                  [ngClass]="{
                    'disabled-row':
                      clientGroup.status === 0
                  }"

                  (click)="
                    viewClientGroup(clientGroup.id)
                  "

                  style="cursor:pointer"
                >


                  <!-- Group Name -->
                  <td>

                    {{ clientGroup.name }}

                  </td>


                  <!-- Group Code -->
                  <td>

                    {{ clientGroup.code }}

                  </td>


                  <!-- Description -->
                  <td>

                    <span
                      *ngIf="clientGroup.description"
                    >
                      {{ clientGroup.description }}
                    </span>

                    <span
                      *ngIf="!clientGroup.description"
                      class="text-muted"
                    >
                      —
                    </span>

                  </td>


                  <!-- Status -->
                  <td
                    (click)="$event.stopPropagation()"
                  >

                    <app-status-toggle
                      [checked]="
                        clientGroup.status === 1
                      "

                      (toggled)="
                        onStatusToggle(
                          clientGroup,
                          $event
                        )
                      "
                    >
                    </app-status-toggle>

                  </td>


                  <!-- Actions -->
                  <td
                    class="col-action"
                    (click)="$event.stopPropagation()"
                  >

                    <app-three-dots-button

                      [active]="
                        activeMenuId ===
                        clientGroup.id
                      "

                      (menuClick)="
                        openMenu(
                          clientGroup,
                          $event
                        )
                      "
                    >
                    </app-three-dots-button>

                  </td>


                </tr>

              </ng-container>


            </tbody>

          </table>

        </div>


        <!-- Pagination -->
        <app-pagination-footer

          *ngIf="totalItems > 0"

          [totalItems]="totalItems"

          [pageSize]="pageSize"

          [currentPage]="currentPage"

          itemLabel="client groups"

          (pageChange)="
            onPageChange($event)
          "
        >
        </app-pagination-footer>


      </div>

    </div>

  </section>

</main>


<!-- Popup Menu -->
<app-popup-menu

  *ngIf="menuPopupPosition"

  title="Actions"

  [items]="actionItems"

  [position]="menuPopupPosition"

  (itemClick)="
    onMenuItemClick($event)
  "

  (closeClick)="
    closeMenu()
  "
>
</app-popup-menu>
