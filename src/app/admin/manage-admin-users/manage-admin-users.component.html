

<main id="main" class="main">
  <section class="section">
    <div class="container-fluid py-4">


      <div class="page-header-row">
        <div class="page-header">
          <h1>Manage Sub-Admin Users</h1>
          <p>View and manage all sub-admin users and their access levels</p>
        </div>
        <div class="page-header-actions">
          <button *ngIf="canAdd" class="btn-primary tour-add-subadmin" (click)="addSubAdmin()">
            <i class="bi bi-plus-lg"></i> Add User
          </button>
        </div>
      </div>
<div class="plan-limit-banner" *ngIf="userLimit !== null" [class.limit-reached]="limitReached">
  <i class="bi" [ngClass]="limitReached ? 'bi-exclamation-triangle-fill' : 'bi-info-circle'"></i>
  <span>Sub-Admin Users used: <strong>{{ limitLabel }}</strong></span>
  <span *ngIf="limitReached" class="limit-warning-text">
    — limit reached. Upgrade your plan to add more users.
  </span>
</div>
      <div class="data-table-wrapper">



        <div class="page-top-toolbar">
          <div class="toolbar-left">
            <label class="entries-label">
              Show
              <span class="entries-select-wrap">
                <div class="entries-select-box">
                  <span class="entries-number">{{ pageSize }}</span>
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5"
                      stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </div>
                <select class="entries-select-native" [value]="pageSize"
                  (change)="onPageSizeChange($event)">
                  <option *ngFor="let s of [10, 25, 50, 100]" [value]="s">{{ s }}</option>
                </select>
              </span>
              entries
            </label>
          </div>

          <div class="toolbar-right">
            <div class="search-input-wrap">
              <span class="search-icon">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.5" />
                  <path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </span>
              <input class="search-input tour-search-subadmin" type="text" placeholder="Search..."
                [(ngModel)]="search" (input)="onSearchChange()" />
            </div>
          </div>
        </div>

        <div class="data-table-scroll tour-table-subadmin">
          <table id="adminTable" class="data-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Status</th>
                <th class="col-action">Actions</th>
              </tr>
            </thead>
            <tbody>

              <ng-container *ngIf="loading">
                <tr *ngFor="let r of [1,2,3,4,5]" class="sk-list-row">
                  <td><div class="sk sk-cell sk-cell--lg"></div></td>
                  <td><div class="sk sk-cell sk-cell--sm"></div></td>
                  <td><div class="sk sk-cell sk-cell--lg"></div></td>
                  <td><div class="sk sk-cell sk-cell--sm"></div></td>
                  <td class="col-action"><div class="sk sk-cell sk-cell--xs" style="margin:0 auto"></div></td>
                </tr>
              </ng-container>

              <tr *ngIf="!loading && filteredUsers.length === 0">
                <td colspan="5" class="text-center py-5">
                  <div class="text-muted">No sub-admin users found.</div>
                </td>
              </tr>

             <ng-container *ngIf="!loading">
  <tr *ngFor="let subAdmin of paginatedUsers; let i = index"
    [ngClass]="{'disabled-row': subAdmin.status === 0}"
    (click)="viewSubAdmin(subAdmin.id)"
    style="cursor:pointer">

    <td>{{ subAdmin.name }}</td>
    <td>{{ subAdmin.phone }}</td>
    <td>{{ subAdmin.email }}</td>

    <td (click)="$event.stopPropagation()">
      <app-status-toggle
        [checked]="subAdmin.status === 1"
        (toggled)="onStatusToggle(subAdmin, $event)">
      </app-status-toggle>
    </td>

    <td class="col-action" (click)="$event.stopPropagation()">
      <app-three-dots-button
        [class.tour-actions-subadmin]="i === 0"
        [active]="activeMenuId === subAdmin.id"
        (menuClick)="openMenu(subAdmin, $event)">
      </app-three-dots-button>
    </td>
  </tr>
</ng-container>

            </tbody>
          </table>
        </div>

        <app-pagination-footer
          *ngIf="totalItems > 0"
          [totalItems]="totalItems"
          [pageSize]="pageSize"
          [currentPage]="currentPage"
          itemLabel="sub-admins"
          (pageChange)="onPageChange($event)">
        </app-pagination-footer>

      </div>
    </div>
  </section>
</main>

<app-popup-menu
  *ngIf="menuPopupPosition"
  title="Actions"
  [items]="actionItems"
  [position]="menuPopupPosition"
  (itemClick)="onMenuItemClick($event)"
  (closeClick)="closeMenu()">
</app-popup-menu>
