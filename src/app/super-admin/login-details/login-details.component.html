<main id="main" class="complaint-wrapper">
  <header class="top-header">
    <div class="header-left">
      <button type="button" class="back-btn" (click)="goBack()" aria-label="Go back">
        <img src="assets/img/back-icon.svg" alt="back">
      </button>

      <div class="divider"></div>

      <div class="title-box">
        <div class="title-icon">
          <img src="assets/img/Plus.svg" alt="session">
        </div>
        <div class="title-text">
          <h4>Login Session Details</h4>
          <p>User session and location information</p>
        </div>
      </div>
    </div>

    <div class="header-actions">
    </div>
  </header>

  <article class="card complaint-card">

    <div class="section-title">
      <div class="item-icon">
        <img src="assets/img/Information.svg" alt="info">
      </div>
      <div class="header-content">
        <span class="header-text">Session Information</span>
      </div>
    </div>

    <div *ngIf="loading" class="status-state">
      <span class="status-spinner"></span>
      <p>Loading session details...</p>
    </div>

    <div *ngIf="error" class="alert alert-danger mx-4 mt-3" role="alert">
      {{ error }}
    </div>

    <div *ngIf="sessionDetails && !loading" class="form-padding-wrap">

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label>Session ID</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input type="text" class="form-controler"
              [value]="sessionDetails?.session_id || sessionDetails?.id"
              readonly />
          </div>
        </div>

        <div class="col-md-6 form-group">
          <label>User Name</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input type="text" class="form-controler"
              [value]="sessionDetails?.User?.name || sessionDetails?.user_id"
              readonly />
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label>IP Address</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input type="text" class="form-controler"
              [value]="sessionDetails?.ip_address"
              readonly />
          </div>
        </div>

        <div class="col-md-6 form-group">
          <label>Location</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input type="text" class="form-controler"
              [value]="locationLoading ? 'Resolving address...' : locationAddress"
              readonly />
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label>Session Created</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input type="text" class="form-controler"
              [value]="sessionDetails?.session_created | date:'medium'"
              readonly />
          </div>
        </div>

        <div class="col-md-6 form-group">
          <label>Session Ended</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <input type="text" class="form-controler"
              [value]="sessionDetails?.session_ended ? (sessionDetails?.session_ended | date:'medium') : '-'"
              readonly />
          </div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-12 form-group">
          <label>User Agent</label>
          <div class="field-wrap" style="--field-icon: url('assets/img/category-sub.svg')">
            <textarea class="form-controler" [value]="sessionDetails?.user_agent" readonly></textarea>
          </div>
        </div>
      </div>

    </div>
  </article>
</main>
