<div class="ph-row">
  <div class="ph-text">
    <h1 class="ph-title">{{ title }}</h1>
    <p class="ph-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
  </div>

  <div class="ph-actions">
    <ng-content></ng-content>

      *ngIf="showFilter"
      class="btn-filter"
      [class.btn-filter--active]="filterActive"
      (click)="filterToggle.emit()"

          stroke="currentColor"
          stroke-miterlimit="10"
          stroke-linecap="round"
        />
      </svg>
      Filter
      <span *ngIf="filterActive" class="filter-active-dot"></span>
    </button>

    <button
      *ngIf="showReset"
      class="btn-undo"
      (click)="resetClick.emit()"
    >
      Reset
    </button>
  </div>
</div>
